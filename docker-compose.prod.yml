services:
  web:
    build:
      context: ./frontend
    image: sksiskur-web:latest
    restart: unless-stopped
    ports:
      - "${SKS_PORT:-8093}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - sksiskur

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: sksiskur-api:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sksiskur?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_UPLOAD_DIR: /data/uploads
      # Geçici test ortamı: gerçek yayına geçmeden önce "false" yapın.
      APP_DEMO_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://193.140.136.26:${SKS_PORT:-8093}
    volumes:
      - sksiskur_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sksiskur

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sksiskur
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_turkish_ci
    volumes:
      - sksiskur_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sksiskur

volumes:
  sksiskur_mysql:
  sksiskur_uploads:

networks:
  sksiskur:
