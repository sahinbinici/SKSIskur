# Production deploy uses a self-hosted runner on the app server (cekec@193.140.136.26).
# GitHub-hosted runners cannot SSH in: campus firewall times out port 22.
# Runner label: sksiskur-prod
# The runner pulls jobs over HTTPS; no inbound SSH from GitHub is required.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: mvn -B -ntp test

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  package:
    name: Package release
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package backend
        run: mvn -B -ntp -DskipTests package

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create deploy archive
        run: bash scripts/pack-deploy.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sksiskur-deploy
          path: sksiskur-deploy.tar.gz
          retention-days: 7

  deploy:
    name: Deploy production
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, sksiskur-prod]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sksiskur-deploy
          path: ${{ github.workspace }}

      - name: Extract and restart containers
        env:
          APP_DIR: /home/cekec/apps/sksiskur
        run: |
          set -euo pipefail
          STAMP="$(date +%Y%m%d%H%M%S)"
          mkdir -p "$APP_DIR/backups" "$APP_DIR/target"
          if [ -f "$APP_DIR/target/SKSIskur-0.0.1-SNAPSHOT.war" ]; then
            cp "$APP_DIR/target/SKSIskur-0.0.1-SNAPSHOT.war" "$APP_DIR/backups/SKSIskur-$STAMP.war"
          fi
          tar -xzf "$GITHUB_WORKSPACE/sksiskur-deploy.tar.gz" -C "$APP_DIR"
          cd "$APP_DIR"
          docker compose -f docker-compose.prod.yml --env-file .env up -d --build
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8093/ || true)"
            if [ "$code" = "200" ]; then
              echo "Health check OK ($code)"
              docker compose -f docker-compose.prod.yml --env-file .env ps
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker compose -f docker-compose.prod.yml --env-file .env ps
          docker logs --tail 80 sksiskur-web-1 || true
          docker logs --tail 80 sksiskur-api-1 || true
          exit 1
